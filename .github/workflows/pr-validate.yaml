---
name: "Pull Request: Validate"

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

concurrency:
  group: ${{ github.head_ref }}-pr-validate
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare data required for workflow
    runs-on: ubuntu-24.04
    outputs:
      addedOrModifiedFiles: ${{ steps.added-modified-files.outputs.changed_files }}
      chartsToLint: ${{ steps.charts-to-lint.outputs.filteredCharts }}
      chartsToInstall: ${{ steps.charts-to-install.outputs.filteredCharts }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mise and set up tool cache
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Grab repository configuration
        id: repo-config
        shell: bash
        run: |
          echo "config=$(yq '.' '.ci/repo-config.yaml' -o json -I=0)" >> "$GITHUB_OUTPUT"

      - name: Get all added or modified files
        id: added-modified-files
        uses: bjw-s-labs/action-changed-files@015416e33c709af88f84a4496f4030c1f0ef212e # v0.5.0

      - name: Get all added or modified charts
        id: changed-charts
        uses: bjw-s-labs/action-changed-files@015416e33c709af88f84a4496f4030c1f0ef212e # v0.5.0
        with:
          path: charts
          include_only_directories: true
          max_depth: 2

      - name: Determine charts to lint
        id: charts-to-lint
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHANGED_CHARTS: ${{ steps.changed-charts.outputs.changed_files }}
          REPO_SETTINGS: ${{ steps.repo-config.outputs.config }}
        with:
          script: |
            const { CHANGED_CHARTS, REPO_SETTINGS } = process.env;
            const changedCharts = JSON.parse(CHANGED_CHARTS);
            const repoSettings = JSON.parse(REPO_SETTINGS);
            const chartsToFilter = repoSettings['excluded-charts-lint'];
            let filteredCharts = changedCharts.filter(item => chartsToFilter.indexOf(item) < 0);
            core.setOutput("filteredCharts", filteredCharts);
            console.log('charts to lint:', JSON.stringify(filteredCharts, null, 2));

      - name: Determine charts to install
        id: charts-to-install
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHANGED_CHARTS: ${{ steps.changed-charts.outputs.changed_files }}
          REPO_SETTINGS: ${{ steps.repo-config.outputs.config }}
        with:
          script: |
            const { CHANGED_CHARTS, REPO_SETTINGS } = process.env;
            const changedCharts = JSON.parse(CHANGED_CHARTS);
            const repoSettings = JSON.parse(REPO_SETTINGS);
            const chartsToFilter = repoSettings['excluded-charts-install'];
            let filteredCharts = changedCharts.filter(item => chartsToFilter.indexOf(item) < 0);
            core.setOutput("filteredCharts", filteredCharts);
            console.log('charts to install:', JSON.stringify(filteredCharts, null, 2));

  check-values:
    name: Check values.yaml is up-to-date
    runs-on: ubuntu-24.04
    needs:
      - prepare
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mise and required tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Build Go tool
        run: |
          cd tools/helm-schema-tools
          go build -o helm-schema-tools ./cmd/helm-schema-tools/

      - name: Check values.yaml is up-to-date
        run: just chart::check-values library/common

  pre-commit-check:
    name: Perform Pre-Commit check
    runs-on: ubuntu-24.04
    needs:
      - prepare
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mise and required tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Run against changes
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --files ${{ join(fromJSON(needs.prepare.outputs.addedOrModifiedFiles), ' ') }} --config .ci/pre-commit/config.yaml

  lint-validate-required-changes:
    name: Validate required changes
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.prepare.outputs.chartsToLint) }}
      fail-fast: false
    needs:
      - prepare
    if: |
      (needs.prepare.outputs.chartsToLint != '[]' && needs.prepare.outputs.chartsToLint != '')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: pull
          persist-credentials: false

      - name: Checkout default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default
          persist-credentials: false

      - name: Get chart details for PR
        id: chart-details-pr
        env:
          CHART: ${{ matrix.chart }}
        run: |
          pull/.ci/scripts/get-chart-details.sh \
            "pull/charts/${CHART}" \
            --validateChartYaml \
            --requireChangelog

      - name: Get chart details for default branch
        id: chart-details-default
        env:
          CHART: ${{ matrix.chart }}
        run: |
          pull/.ci/scripts/get-chart-details.sh \
            "default/charts/${CHART}" \
            --allowChartToNotExist

  lint-validate-success:
    needs:
      - prepare
      - lint-validate-required-changes
    if: ${{ !cancelled() }}
    name: Validation successful
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: >-
          ${{
              (needs.prepare.outputs.chartsToLint != '' && needs.prepare.outputs.chartsToLint != '[]') &&
              contains(needs.*.result, 'failure')
          }}
        run: exit 1

  lint-chart:
    if: ${{ needs.prepare.outputs.chartsToLint != '[]' && needs.prepare.outputs.chartsToLint != '' }}
    name: Lint chart
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.prepare.outputs.chartsToLint) }}
      fail-fast: false
    needs:
      - prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mise and required tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Run chart-testing (lint)
        working-directory: ${{ github.workspace }}
        env:
          CHART: ${{ matrix.chart }}
        run: just chart::lint "${CHART}"

  lint-success:
    needs:
      - prepare
      - lint-chart
    if: ${{ !cancelled() }}
    name: Lint successful
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: >-
          ${{
              (needs.prepare.outputs.chartsToLint != '' && needs.prepare.outputs.chartsToLint != '[]') &&
              contains(needs.*.result, 'failure')
          }}
        run: exit 1

  test-build-matrix:
    name: Build charts/version matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.chartsToInstall != '[]' && needs.prepare.outputs.chartsToInstall != '' }}
    outputs:
      matrix: ${{ steps.merge.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build kubernetes version matrix
        id: build
        uses: ./.github/actions/build-k8s-k3s-version-matrix # zizmor: ignore[self-repository] intentional workspace-local reference
        with:
          min_k8s_version: "1.28"
          github_token: ${{ github.token }}

      - name: Merge charts with versions
        id: merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHARTS_JSON: ${{ needs.prepare.outputs.chartsToInstall }}
          VERSIONS_JSON: ${{ steps.build.outputs.versions }}
        with:
          script: |
            const rawCharts = process.env.CHARTS_JSON;
            const rawVersions = process.env.VERSIONS_JSON;

            const charts = rawCharts && rawCharts !== 'null' ? JSON.parse(rawCharts) : [];
            const versions = rawVersions && rawVersions !== 'null' ? JSON.parse(rawVersions) : [];

            const matrix = charts.flatMap((chart) =>
              versions.map((version) => ({
                chart,
                k8s_version: version.k8s_version,
                k3s_tag: version.k3s_tag,
              }))
            );

            core.setOutput('matrix', JSON.stringify(matrix));
            console.log(JSON.stringify(matrix));

  test-install-chart:
    name: Install chart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - test-build-matrix
    if: ${{ needs.test-build-matrix.outputs.matrix != '[]' && needs.test-build-matrix.outputs.matrix != '' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.test-build-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate prerequisite folders
        env:
          CHART_PATH: "charts/${{ matrix.chart }}"
        working-directory: ${{ env.CHART_PATH }}
        run: |
          CHART_TYPE=$(yq '.type // "application"' Chart.yaml)
          if [[ ("${CHART_TYPE}" == "library") && (! -d "test-chart") ]]; then
            echo "Library charts require a \"test-chart\" directory to run tests"
            exit 1
          fi

      - name: Install kubectl matching k8s version
        uses: yokawasa/action-setup-kube-tools@5778123f7b071387e9c8e522492d8f39427dc6c7 # v0.13.4
        with:
          setup-tools: |
            kubectl
          kubectl: "${{ matrix.k8s_version }}"

      - name: Install Mise and required tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Create a new k3s cluster
        env:
          K8S_VERSION: ${{ matrix.k8s_version }}
          K3S_IMAGE: docker.io/rancher/k3s
          K3S_TAG: ${{ matrix.k3s_tag }}
        run: |
          k3d cluster create --image "${K3S_IMAGE}:${K3S_TAG}"
          echo "::group::Waiting for cluster readiness"
          while ! kubectl get serviceaccount default >/dev/null; do sleep 1; done
          echo "::endgroup::"

      - name: Remove node taints
        run: |
          kubectl taint --all=true nodes node.cloudprovider.kubernetes.io/uninitialized- || true

      - name: Run chart-testing (install)
        working-directory: ${{ github.workspace }}
        env:
          CHART: ${{ matrix.chart }}
        run: just chart::integration-test "${CHART}"

  test-install-success:
    needs:
      - prepare
      - test-install-chart
    if: ${{ !cancelled() }}
    name: Install successful
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: >-
          ${{
              (needs.prepare.outputs.chartsToInstall != '' && needs.prepare.outputs.chartsToInstall != '[]') &&
              contains(needs.*.result, 'failure')
          }}
        run: exit 1

  test-unittest-chart:
    name: Unit-test chart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.chartsToInstall != '[]' && needs.prepare.outputs.chartsToInstall != '' }}
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.prepare.outputs.chartsToInstall) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate prerequisite folders
        env:
          CHART_PATH: "charts/${{ matrix.chart }}"
        working-directory: ${{ env.CHART_PATH }}
        run: |
          CHART_TYPE=$(yq '.type // "application"' Chart.yaml)
          if [[ ("${CHART_TYPE}" == "library") && (! -d "test-chart") ]]; then
            echo "Library charts require a \"test-chart\" directory to run tests"
            exit 1
          fi

      - name: Install Mise and required tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Run tests
        working-directory: ${{ github.workspace }}
        env:
          CHART: ${{ matrix.chart }}
        run: just chart::unit-test "${CHART}" "**/*_test.yaml"

  test-unittest-success:
    needs:
      - prepare
      - test-unittest-chart
    if: ${{ !cancelled() }}
    name: Unittest successful
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: >-
          ${{
              (needs.prepare.outputs.chartsToInstall != '' && needs.prepare.outputs.chartsToInstall != '[]') &&
              contains(needs.*.result, 'failure')
          }}
        run: exit 1
