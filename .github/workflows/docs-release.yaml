---
name: "Docs: Release to GitHub pages"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-release.yaml"
      - "docs/**"
      - "charts/library/common/schemas/**"
      - "charts/library/common/values.schema.json"
      - "tools/helm-schema-tools/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mise and required tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Build Go tool
        run: |
          cd tools/helm-schema-tools
          go build -o helm-schema-tools ./cmd/helm-schema-tools/

      - name: Generate reference docs and schema
        run: just docs::generate

      - name: Build Starlight site
        run: just docs::build

      - name: Checkout gh-pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          path: gh-pages
          ref: gh-pages
          persist-credentials: true

      - name: Publish documentation to gh-pages
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail

          cd gh-pages
          git pull --rebase
          rm -rf docs
          mkdir docs
          cp -a ../docs/dist/. docs/
          git add --all docs

          # The documentation workflow may only update the documentation subtree.
          git diff --cached --name-only | while read -r file; do
            case "$file" in
              docs/*) ;;
              *) exit 1 ;;
            esac
          done

          git diff --cached --quiet || git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: Update documentation site'
          git push origin gh-pages

  publish-docs:
    name: Publish documentation
    runs-on: ubuntu-24.04
    needs:
      - build-docs
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://bjw-s-labs.github.io/helm-charts/docs/
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: gh-pages
          ref: gh-pages
          persist-credentials: false

      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail

          # Deploy the complete branch so chart packages and documentation coexist.
          rm -rf "$RUNNER_TEMP/pages"
          mkdir "$RUNNER_TEMP/pages"
          tar --dereference --hard-dereference --directory gh-pages -cf "$RUNNER_TEMP/pages.tar" --exclude=.git --exclude=.github --exclude='.[^/]*' .
          tar -xf "$RUNNER_TEMP/pages.tar" -C "$RUNNER_TEMP/pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/pages
          name: github-pages
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages
