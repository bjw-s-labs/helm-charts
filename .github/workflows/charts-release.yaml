---
name: "Charts: Release"

concurrency: helm-release

on:
  workflow_dispatch:
    inputs:
      charts:
        description: "JSON encoded list of charts to release"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - "charts/**"

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare data required for workflow
    runs-on: ubuntu-24.04
    outputs:
      chartsToRelease: ${{ steps.filtered-charts.outputs.chartsToRelease }}
    steps:
      # ----------------------------
      # Setup
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Mise and set up tool cache
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          cache_key: "mise-v1-{{file_hash}}"

      - name: Grab repository configuration
        id: repo-config
        shell: bash
        run: |
          echo "config=$(yq '.' '.ci/repo-config.yaml' -o json -I=0)" >> "$GITHUB_OUTPUT"

      - name: Get changed charts
        id: changed-charts
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: bjw-s-labs/action-changed-files@015416e33c709af88f84a4496f4030c1f0ef212e # v0.5.0
        with:
          path: charts
          include_only_directories: true
          max_depth: 2

      - name: Get specified charts
        id: specified-charts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUTS_CHARTS: ${{ inputs.charts }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const input = process.env.INPUTS_CHARTS ?? '';
            let charts;

            try {
              charts = JSON.parse(input);
            } catch (error) {
              throw new Error("Workflow dispatch 'charts' input must be a non-empty JSON array, for example [\"other/example\"].");
            }

            if (!Array.isArray(charts) || charts.length === 0) {
              throw new Error("Workflow dispatch 'charts' input must be a non-empty JSON array; specify at least one chart to release.");
            }

            const cwd = process.cwd();
            charts.forEach((chart) => {
              if (typeof chart !== 'string') {
                throw new Error("Each requested chart must be a string path, for example 'other/example'.");
              }
              const normalizedChart = path.posix.normalize(chart);
              const hasDotSegment = chart.split('/').some(segment => segment === '.' || segment === '..');
              if (
                chart.length === 0 ||
                chart.startsWith('/') ||
                chart.endsWith('/') ||
                hasDotSegment ||
                normalizedChart !== chart
              ) {
                throw new Error(`Chart '${chart}' is not a canonical chart identifier; use a path such as 'other/example' without '.', '..', or duplicate separators.`);
              }
              const fullPath = `${cwd}/charts/${chart}`;
              if (!fs.existsSync(fullPath)) {
                throw new Error(`Chart '${chart}' does not exist in repository; specify a chart directory under 'charts/'.`);
              }
              if (!fs.lstatSync(fullPath).isDirectory()) {
                throw new Error(`Chart '${chart}' is not a valid directory; specify a chart directory under 'charts/'.`);
              }
            });

            core.setOutput('chartsToRelease', JSON.stringify(charts));

      - name: Filter out excluded charts
        id: filtered-charts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SPECIFIED_CHARTS: ${{ steps.specified-charts.outputs.chartsToRelease }}
          CHANGED_CHARTS: ${{ steps.changed-charts.outputs.changed_files }}
          REPO_SETTINGS: ${{ steps.repo-config.outputs.config }}
        with:
          script: |
            const SPECIFIED_CHARTS = process.env.SPECIFIED_CHARTS ?? '[]';
            const CHANGED_CHARTS = process.env.CHANGED_CHARTS ?? '[]';
            const REPO_SETTINGS = process.env.REPO_SETTINGS ?? '{}';

            const eventName = '${{ github.event_name }}';
            const repoSettings = JSON.parse(REPO_SETTINGS);

            const chartsInput = JSON.parse(eventName === 'workflow_dispatch' ? SPECIFIED_CHARTS : CHANGED_CHARTS);
            const excludedFromRelease = new Set(repoSettings['excluded-charts-release'] ?? []);
            const chartsToRelease = chartsInput.filter(item => !excludedFromRelease.has(item));
            const libraryCharts = chartsToRelease.filter(chart => chart.startsWith('library/'));
            const otherCharts = chartsToRelease.filter(chart => !chart.startsWith('library/'));

            if (libraryCharts.length > 0 && otherCharts.length > 0) {
              throw new Error(`Charts release selection mixes library charts (${libraryCharts.join(', ')}) and non-library charts (${otherCharts.join(', ')}); run the workflow separately for each group.`);
            }

            console.log('Library charts to release:', JSON.stringify(libraryCharts, null, 2));
            console.log('Other charts to release:', JSON.stringify(otherCharts, null, 2));
            core.setOutput('chartsToRelease', JSON.stringify(chartsToRelease));
            console.log('Charts to release:', JSON.stringify(chartsToRelease, null, 2));

  release-charts:
    name: Release charts
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.chartsToRelease != '[]' && needs.prepare.outputs.chartsToRelease != '' }}
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.prepare.outputs.chartsToRelease) }}
      fail-fast: false
      max-parallel: 1
    permissions:
      pages: write
      id-token: write
      contents: write
      packages: write
    uses: ./.github/workflows/chart-release-steps.yaml # zizmor: ignore[self-repository] intentional workspace-local reference
    with:
      chart: ${{ matrix.chart }}
      createGithubRelease: true
      publishToGhPages: true
      publishToOciRegistry: true
      deployGhPages: true
