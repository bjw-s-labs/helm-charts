---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: networkPolicy - fields - podSelector
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
tests:
  - it: networkpolicy targets the correct controller by identifier
    set:
      networkpolicies:
        main:
          controller: main
          policyTypes:
            - Ingress
            - Egress
          rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/controller: main
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME

  - it: networkpolicy auto-targets single controller when none specified
    set:
      networkpolicies:
        main:
          policyTypes:
            - Ingress
            - Egress
          rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/controller: main
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME

  - it: networkpolicy targets multiple controllers
    set:
      controllers.secondary:
        containers:
          main:
            image:
              repository: nginx
              tag: latest
      networkpolicies.main:
        controllers:
          - main
          - secondary
        policyTypes:
          - Ingress
          - Egress
        rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME
            matchExpressions:
              - key: app.kubernetes.io/controller
                operator: In
                values:
                  - main
                  - secondary

  - it: networkpolicy expands controller regular expressions without duplicates
    set:
      controllers:
        worker-low:
          containers:
            main:
              image:
                repository: nginx
                tag: latest
        worker-high:
          containers:
            main:
              image:
                repository: nginx
                tag: latest
        worker-disabled:
          enabled: false
          containers:
            main:
              image:
                repository: nginx
                tag: latest
      networkpolicies.main:
        controllers:
          - worker-low
          - worker-.*
          - worker-low
        policyTypes:
          - Ingress
        rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector.matchExpressions[0].values
          value:
            - worker-high
            - worker-low

  - it: networkpolicy supports multiple controllers with extraSelectorLabels
    set:
      controllers.secondary:
        containers:
          main:
            image:
              repository: nginx
              tag: latest
      networkpolicies.main:
        controllers:
          - main
          - secondary
        extraSelectorLabels:
          custom-label: custom-value
        policyTypes:
          - Ingress
        rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              custom-label: custom-value
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME
            matchExpressions:
              - key: app.kubernetes.io/controller
                operator: In
                values:
                  - main
                  - secondary

  - it: extra selector labels take precedence over multi-controller targeting
    set:
      controllers.secondary:
        containers:
          main:
            image:
              repository: nginx
              tag: latest
      networkpolicies.main:
        controllers:
          - main
          - secondary
        extraSelectorLabels:
          app.kubernetes.io/controller: overridden
        policyTypes:
          - Ingress
        rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/controller: overridden
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME

  - it: networkpolicy supports controller with extraSelectorLabels
    set:
      networkpolicies:
        main:
          controller: main
          extraSelectorLabels:
            custom-label: custom-value
          policyTypes:
            - Ingress
            - Egress
          rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              custom-label: custom-value
              app.kubernetes.io/controller: main
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME

  - it: auto-targeting controller with extraSelectorLabels is supported
    set:
      networkpolicies:
        main:
          extraSelectorLabels:
            custom-label: custom-value
          policyTypes:
            - Ingress
            - Egress
          rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              custom-label: custom-value
              app.kubernetes.io/controller: main
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME

  - it: extra selector labels take precedence over generated selector labels
    set:
      networkpolicies:
        main:
          controller: main
          extraSelectorLabels:
            "app.kubernetes.io/controller": overridden
          policyTypes:
            - Ingress
            - Egress
          rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              app.kubernetes.io/controller: overridden
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME

  - it: networkpolicy supports custom podSelector with matchLabels
    set:
      networkpolicies:
        main:
          policyTypes:
            - Ingress
            - Egress
          podSelector:
            matchLabels:
              role: frontend
          rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchLabels:
              role: frontend

  - it: networkpolicy supports custom podSelector with matchExpressions
    set:
      networkpolicies:
        main:
          policyTypes:
            - Ingress
            - Egress
          podSelector:
            matchExpressions:
              - key: tier
                operator: In
                values:
                  - frontend
                  - backend
          rules: {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.podSelector
          value:
            matchExpressions:
              - key: tier
                operator: In
                values:
                  - frontend
                  - backend
