---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: networkPolicy - fields - rules
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
tests:
  - it: networkpolicy rules are passed through
    set:
      networkpolicies:
        main:
          controller: main
          policyTypes:
            - Ingress
            - Egress
          rules:
            ingress:
              - {}
            egress:
              - {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.ingress
          value:
            - {}
      - equal:
          path: spec.egress
          value:
            - {}

  - it: networkpolicy ingress controller peer becomes a pod selector and retains ports
    set:
      networkpolicies.main:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - controller: main
              ports:
                - port: 8080
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: main
                      app.kubernetes.io/instance: RELEASE-NAME
                      app.kubernetes.io/name: RELEASE-NAME
              ports:
                - port: 8080

  - it: networkpolicy egress controller peer becomes a pod selector and retains ports
    set:
      networkpolicies.main:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - to:
                - controller: main
              ports:
                - port: 53
                  protocol: UDP
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.egress
          value:
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: main
                      app.kubernetes.io/instance: RELEASE-NAME
                      app.kubernetes.io/name: RELEASE-NAME
              ports:
                - port: 53
                  protocol: UDP
