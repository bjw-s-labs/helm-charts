---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: networkPolicy - fields - rules
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
tests:
  - it: networkpolicy rules are passed through
    set:
      networkpolicies:
        main:
          controller: main
          policyTypes:
            - Ingress
            - Egress
          rules:
            ingress:
              - {}
            egress:
              - {}
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.ingress
          value:
            - {}
      - equal:
          path: spec.egress
          value:
            - {}

  - it: networkpolicy ingress controllers peer becomes a pod selector and retains ports
    set:
      networkpolicies.main:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - controllers: [main]
              ports:
                - port: 8080
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: main
                      app.kubernetes.io/instance: RELEASE-NAME
                      app.kubernetes.io/name: RELEASE-NAME
              ports:
                - port: 8080

  - it: networkpolicy egress controllers peer becomes a pod selector and retains ports
    set:
      networkpolicies.main:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - to:
                - controllers: [main]
              ports:
                - port: 53
                  protocol: UDP
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.egress
          value:
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: main
                      app.kubernetes.io/instance: RELEASE-NAME
                      app.kubernetes.io/name: RELEASE-NAME
              ports:
                - port: 53
                  protocol: UDP

  - it: networkpolicy ingress controllers peer accepts a regular expression
    set:
      controllers:
        worker-low:
          extraSelectorLabels:
            tier: low
          containers:
            main:
              image:
                repository: nginx
                tag: latest
        worker-high:
          extraSelectorLabels:
            tier: high
          containers:
            main:
              image:
                repository: nginx
                tag: latest
      networkpolicies.main:
        controller: main
        policyTypes: [Ingress]
        rules:
          ingress:
            - from:
                - controllers: [worker-.*]
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.ingress[0].from[0].podSelector
          value:
            matchLabels:
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME
            matchExpressions:
              - key: app.kubernetes.io/controller
                operator: In
                values:
                  - worker-high
                  - worker-low

  - it: networkpolicy egress controllers peer combines exact references
    set:
      controllers.secondary:
        containers:
          main:
            image:
              repository: nginx
              tag: latest
      networkpolicies.main:
        controller: main
        policyTypes: [Egress]
        rules:
          egress:
            - to:
                - controllers: [secondary, main]
              ports:
                - port: 53
    documentSelector:
      path: $[?(@.kind == "NetworkPolicy")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.egress[0].to[0].podSelector
          value:
            matchLabels:
              app.kubernetes.io/instance: RELEASE-NAME
              app.kubernetes.io/name: RELEASE-NAME
            matchExpressions:
              - key: app.kubernetes.io/controller
                operator: In
                values: [main, secondary]
      - equal:
          path: spec.egress[0].ports[0].port
          value: 53
