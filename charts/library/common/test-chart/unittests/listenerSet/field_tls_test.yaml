---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: listenerSet - fields - tls
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/ListenerSet
set:
  listenerSets.main:
    parentRef:
      name: main-gateway
    listeners:
      - name: https
        port: 443
        protocol: HTTPS
tests:
  - it: tls is not emitted when not set
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: spec.listeners[0].tls

  - it: renders tls mode and certificateRefs
    set:
      listenerSets.main.listeners:
        - name: https
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: main-cert
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.listeners[0].tls.mode
          value: Terminate
      - equal:
          path: spec.listeners[0].tls.certificateRefs
          value:
            - group: ""
              kind: Secret
              name: main-cert

  - it: renders passthrough mode without certificateRefs
    set:
      listenerSets.main.listeners:
        - name: https
          port: 443
          protocol: HTTPS
          tls:
            mode: Passthrough
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.listeners[0].tls
          value:
            mode: Passthrough

  - it: passes through additional tls fields
    set:
      listenerSets.main.listeners:
        - name: https
          port: 443
          protocol: HTTPS
          tls:
            mode: Terminate
            certificateRefs:
              - group: ""
                kind: Secret
                name: main-cert
            options:
              key: value
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.listeners[0].tls.options
          value:
            key: value
