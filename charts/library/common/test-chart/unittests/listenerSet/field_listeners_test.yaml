---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: listenerSet - fields - listeners
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/ListenerSet
set:
  listenerSets.main:
    parentRef:
      name: main-gateway
    listeners:
      - name: http
        port: 80
        protocol: HTTP
tests:
  - it: renders listener name, port and protocol
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.listeners[0].name
          value: http
      - equal:
          path: spec.listeners[0].port
          value: 80
      - equal:
          path: spec.listeners[0].protocol
          value: HTTP

  - it: hostname is not emitted when not set
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: spec.listeners[0].hostname

  - it: renders a static hostname
    set:
      listenerSets.main.listeners:
        - name: http
          hostname: app.example.com
          port: 80
          protocol: HTTP
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.listeners[0].hostname
          value: app.example.com

  - it: renders a templated hostname
    set:
      listenerSets.main.listeners:
        - name: http
          hostname: "{{ .Release.Name }}.example.com"
          port: 80
          protocol: HTTP
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.listeners[0].hostname
          value: RELEASE-NAME.example.com

  - it: renders multiple listeners
    set:
      listenerSets.main.listeners:
        - name: http
          hostname: app.example.com
          port: 80
          protocol: HTTP
        - name: https
          hostname: app.example.com
          port: 443
          protocol: HTTPS
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: spec.listeners
          value:
            - name: http
              hostname: app.example.com
              port: 80
              protocol: HTTP
            - name: https
              hostname: app.example.com
              port: 443
              protocol: HTTPS

  - it: listener-level options is rejected by the schema
    set:
      listenerSets.main.listeners:
        - name: http
          port: 80
          protocol: HTTP
          options:
            key: value
    asserts:
      - failedTemplate:
          errorPattern: "values don't meet the specifications of the schema"
