---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: listenerSet - metadata - annotations
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/ListenerSet
set:
  listenerSets.main:
    parentRef:
      name: main-gateway
    listeners:
      - name: http
        port: 80
        protocol: HTTP
tests:
  - it: no annotations are set by default
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - notExists:
          path: metadata.annotations

  - it: custom annotations
    set:
      listenerSets.main.annotations:
        test_annotation: test
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: metadata.annotations
          value:
            test_annotation: test

  - it: custom annotations mixed with global annotations
    set:
      global.annotations:
        global_annotation: test
      listenerSets.main.annotations:
        test_annotation: test
    documentSelector:
      path: $[?(@.kind == "ListenerSet")].metadata.name
      value: release-name
    asserts:
      - equal:
          path: metadata.annotations
          value:
            global_annotation: test
            test_annotation: test
