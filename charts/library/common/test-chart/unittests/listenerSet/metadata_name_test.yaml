---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: listenerSet - metadata - name
templates:
  - common.yaml
values:
  - ../_values/controllers_main_default_container.yaml
capabilities:
  apiVersions:
    - gateway.networking.k8s.io/v1/ListenerSet
set:
  listenerSets.main:
    parentRef:
      name: main-gateway
    listeners:
      - name: http
        port: 80
        protocol: HTTP
tests:
  - it: name defaults to chart fullName
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name
          any: true

  - it: name includes identifier when alwaysAppendIdentifierToResourceName is enabled
    set:
      global.alwaysAppendIdentifierToResourceName: true
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-main
          any: true

  - it: forceRename
    set:
      listenerSets.main.forceRename: forceRename
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: forcerename
          any: true

  - it: forceRename with template
    set:
      listenerSets.main.forceRename: "{{ .Chart.Name }}"
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: common-test
          any: true

  - it: prefix
    set:
      listenerSets.main.prefix: prefix
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: prefix-release-name
          any: true

  - it: prefix with template
    set:
      listenerSets.main.prefix: "{{ .Chart.Name }}"
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: common-test-release-name
          any: true

  - it: suffix
    set:
      listenerSets.main.suffix: suffix
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-suffix
          any: true

  - it: suffix with template
    set:
      listenerSets.main.suffix: "{{ .Chart.Name }}"
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-common-test
          any: true

  - it: both prefix and suffix
    set:
      listenerSets.main.prefix: prefix
      listenerSets.main.suffix: suffix
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: prefix-release-name-suffix
          any: true

  - it: prefix, suffix and forceRename (illegal combination)
    set:
      listenerSets.main.forceRename: forceRename
      listenerSets.main.prefix: prefix
      listenerSets.main.suffix: suffix
    asserts:
      - failedTemplate:
          errorPattern: "values don't meet the specifications of the schema"

  - it: multiple items
    set:
      listenerSets.second:
        parentRef:
          name: second-gateway
        listeners:
          - name: http
            port: 80
            protocol: HTTP
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-main
          any: true
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-second
          any: true

  - it: multiple items with prefix
    set:
      listenerSets.second:
        prefix: prefix
        parentRef:
          name: second-gateway
        listeners:
          - name: http
            port: 80
            protocol: HTTP
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-main
          any: true
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: prefix-release-name-second
          any: true

  - it: multiple items with suffix
    set:
      listenerSets.second:
        suffix: suffix
        parentRef:
          name: second-gateway
        listeners:
          - name: http
            port: 80
            protocol: HTTP
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-main
          any: true
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-second-suffix
          any: true

  - it: multiple items with prefix and suffix
    set:
      listenerSets.second:
        prefix: prefix
        suffix: suffix
        parentRef:
          name: second-gateway
        listeners:
          - name: http
            port: 80
            protocol: HTTP
    asserts:
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: release-name-main
          any: true
      - containsDocument:
          kind: ListenerSet
          apiVersion: gateway.networking.k8s.io/v1
          name: prefix-release-name-second-suffix
          any: true

  - it: multiple items with prefix, suffix and forceRename (illegal combination)
    set:
      listenerSets.second:
        forceRename: forceRename
        prefix: prefix
        suffix: suffix
        parentRef:
          name: second-gateway
        listeners:
          - name: http
            port: 80
            protocol: HTTP
    asserts:
      - failedTemplate:
          errorPattern: "values don't meet the specifications of the schema"
