---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: common - direct function consumers
templates:
  - direct-function.yaml
values:
  - ../_values/controllers_main_default_container.yaml
tests:
  - it: renders controller selector labels without the loader and without changing the controller object
    set:
      global: {}
      variables.directControllerSelectorTest: true
      controllers.main.extraSelectorLabels:
        component: "{{ .Release.Name }}"
        '{{ print "track" }}': stable
      controllers.main.labels:
        metadata-only: ignored
    asserts:
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: common-test
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/controller: main
            component: RELEASE-NAME
            track: stable
      - equal:
          path: data.originalComponent
          value: "{{ .Release.Name }}"

  - it: renders strings when invoked without the loader context
    set:
      variables:
        directFunctionTest: true
        repository: ghcr.io/example/application
        tag: v1.2.3
    asserts:
      - equal:
          path: data.image
          value: ghcr.io/example/application:v1.2.3

  - it: renders class data when invoked without the loader context
    set:
      global: {}
      variables:
        directClassTest: true
        value: rendered-value
    asserts:
      - equal:
          path: data.value
          value: rendered-value
