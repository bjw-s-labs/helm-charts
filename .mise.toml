[env]
JUST_UNSTABLE = "1"

[settings]
experimental = true
pipx.uvx = true

[tools]
actionlint = "1.7.12"
bun = "latest"                      # Required for docs site
go = "1.27.1"                       # Required for helm-schema-tools
gum = "2.0.1"
helm = "4.3.0"
just = "1.58.0"
node = "26"                         # Required for Astro (>=22.12.0)
k3d = "5.9.0"
rust = "1.98.1"                     # Required for schematools
uv = "0.12.15"
yamllint = "1.38.0"
yamlfmt = "0.21.0"
yq = "4.53.6"
zizmor = "1.30.1"

"aqua:helm/chart-testing" = "3.14.0"
"cargo:schematools-cli" = "1.1.0"
"pipx:yamale" = "6.1.0"
